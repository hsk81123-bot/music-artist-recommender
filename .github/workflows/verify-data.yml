name: Verify curation

# 큐레이션의 위키백과 제목이 실제 문서를 가리키는지 확인합니다.
on:
  push:
    paths:
      - "data/artists.json"
      - "jazzbot/wiki.py"
  workflow_dispatch:

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m jazzbot.wiki
