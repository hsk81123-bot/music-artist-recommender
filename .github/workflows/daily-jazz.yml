name: Daily Jazz

on:
  schedule:
    # 매일 08:00 KST = 23:00 UTC (전날). GitHub cron은 수 분~수십 분 늦게 시작될 수 있습니다.
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "오늘 이미 보냈어도 다시 보내기"
        type: boolean
        default: false

permissions:
  contents: write  # data/history.json 커밋용

concurrency:
  group: jazzbot-data  # 봇 명령 워크플로와 동시에 기록을 수정하지 않도록
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Send today's artist
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YTMUSIC_AUTH_JSON: ${{ secrets.YTMUSIC_AUTH_JSON }}
          YTMUSIC_OAUTH_CLIENT_ID: ${{ secrets.YTMUSIC_OAUTH_CLIENT_ID }}
          YTMUSIC_OAUTH_CLIENT_SECRET: ${{ secrets.YTMUSIC_OAUTH_CLIENT_SECRET }}
          YTMUSIC_PLAYLIST_ID: ${{ vars.YTMUSIC_PLAYLIST_ID }}
        run: python -m jazzbot.daily ${{ inputs.force && '--force' || '' }}

      - name: Commit history
        if: always()
        run: |
          git config user.name "daily-jazz-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "chore: daily jazz history $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep $((i * 5)); done
          exit 1
